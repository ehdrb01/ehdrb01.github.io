<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>문제 풀이 보드</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --surface: #ffffff;
        --surface-muted: #f0e8dc;
        --text: #1e2328;
        --muted: #6c747c;
        --line: #d8d0c5;
        --accent: #1c6f67;
        --accent-strong: #0e4f49;
        --answer: #7b3f00;
        --shadow: 0 18px 45px rgba(33, 37, 41, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        letter-spacing: 0;
      }

      button {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 58px;
        margin-bottom: 24px;
      }

      .title-wrap {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 2vw, 2.15rem);
        line-height: 1.15;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        font-weight: 700;
        white-space: nowrap;
      }

      .reset-btn,
      .secondary-btn,
      .primary-btn {
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        padding: 0 16px;
        font-weight: 800;
      }

      .reset-btn,
      .secondary-btn {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
      }

      .primary-btn {
        background: var(--accent);
        color: white;
      }

      .primary-btn:hover {
        background: var(--accent-strong);
      }

      .reset-btn:hover,
      .secondary-btn:hover,
      .problem-dot:hover {
        border-color: var(--accent);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(10, minmax(56px, 1fr));
        gap: 14px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .problem-dot,
      .problem-slot {
        aspect-ratio: 1;
        width: 100%;
        min-width: 0;
        border-radius: 999px;
      }

      .problem-dot {
        border: 2px solid transparent;
        background:
          radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.82), transparent 34%),
          var(--surface-muted);
        color: var(--text);
        font-size: clamp(0.9rem, 1.7vw, 1.2rem);
        font-weight: 900;
        box-shadow: inset 0 -8px 18px rgba(30, 35, 40, 0.08);
        transition:
          border-color 150ms ease,
          transform 150ms ease,
          background 150ms ease;
      }

      .problem-slot {
        border: 2px dashed rgba(216, 208, 197, 0.65);
        background: rgba(246, 243, 238, 0.55);
      }

      .problem-dot:hover {
        transform: translateY(-2px);
        background:
          radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.88), transparent 34%),
          #d9eee8;
      }

      .problem-dot:focus-visible,
      .reset-btn:focus-visible,
      .secondary-btn:focus-visible,
      .primary-btn:focus-visible {
        outline: 3px solid rgba(28, 111, 103, 0.26);
        outline-offset: 3px;
      }

      .empty-state {
        display: none;
        margin-top: 18px;
        padding: 46px 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        text-align: center;
        box-shadow: var(--shadow);
      }

      .empty-state strong {
        display: block;
        margin-bottom: 10px;
        font-size: 1.35rem;
      }

      .empty-state p {
        margin: 0 0 20px;
        color: var(--muted);
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
      }

      .problem-view {
        display: grid;
        gap: 18px;
      }

      .problem-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .problem-number {
        color: var(--accent-strong);
        font-size: 0.95rem;
        font-weight: 900;
      }

      .constraint-text {
        margin-top: 8px;
        color: var(--accent-strong);
        font-size: 0.98rem;
        font-weight: 900;
        line-height: 1.45;
      }

      .constraint-text[hidden] {
        display: none;
      }

      .problem-panel {
        display: grid;
        gap: 22px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .problem-text {
        margin: 0;
        font-size: clamp(1.2rem, 2.2vw, 1.75rem);
        line-height: 1.55;
        white-space: pre-line;
      }

      .question-main {
        font-size: clamp(1.35rem, 2.4vw, 2.1rem);
        font-weight: 850;
        line-height: 1.45;
        white-space: pre-line;
      }

      .question-image {
        display: block;
        width: min(100%, 860px);
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .problem-media {
        display: grid;
        place-items: center;
      }

      .problem-media:empty {
        display: none;
      }

      .problem-media.has-answer-overlay {
        position: relative;
      }

      .problem-media.has-answer-overlay .question-image,
      .problem-media.has-answer-overlay .answer-panel {
        grid-area: 1 / 1;
      }

      .problem-media.has-answer-overlay .answer-panel {
        z-index: 1;
        align-content: end;
        width: min(100%, 860px);
        height: 100%;
        min-height: 0;
        padding: clamp(18px, 4vw, 42px);
        border: 0;
        background: transparent;
        box-shadow: none;
        pointer-events: none;
      }

      .problem-media.has-answer-overlay .answer-panel h2,
      .problem-media.has-answer-overlay .score-text {
        display: none;
      }

      .problem-media.has-answer-overlay .answer-text {
        padding: 10px 18px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--answer);
        box-shadow: 0 10px 28px rgba(42, 23, 5, 0.13);
        font-size: clamp(2.2rem, 6vw, 5.2rem);
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.85);
      }

      .type-kicker {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        min-height: 34px;
        margin-bottom: 18px;
        padding: 0 12px;
        border-radius: 999px;
        background: #e4f4ef;
        color: var(--accent-strong);
        font-size: 0.9rem;
        font-weight: 900;
      }

      .ox-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .ox-mark {
        display: grid;
        min-height: clamp(120px, 20vw, 210px);
        place-items: center;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
        color: var(--accent-strong);
        font-size: clamp(4rem, 12vw, 8.5rem);
        font-weight: 950;
        line-height: 1;
      }

      .action-stage {
        display: grid;
        gap: 20px;
      }

      .action-card {
        display: grid;
        min-height: clamp(220px, 34vh, 390px);
        place-items: center;
        padding: clamp(24px, 5vw, 58px);
        border: 3px solid rgba(28, 111, 103, 0.22);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 0%, rgba(177, 219, 208, 0.8), transparent 48%),
          linear-gradient(135deg, #f8fffc, #e7f4ef);
        text-align: center;
      }

      .action-prompt {
        color: var(--accent-strong);
        font-size: clamp(2.2rem, 7vw, 5.8rem);
        font-weight: 950;
        line-height: 1.08;
        word-break: keep-all;
      }

      .action-rule {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 1.8vw, 1.25rem);
        font-weight: 750;
        line-height: 1.45;
      }

      .charades-stage {
        display: grid;
        gap: 18px;
      }

      .charades-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .charades-topic {
        color: var(--accent-strong);
        font-size: clamp(1rem, 2vw, 1.35rem);
        font-weight: 950;
      }

      .charades-timer {
        min-width: 112px;
        padding: 8px 14px;
        border: 2px solid rgba(28, 111, 103, 0.22);
        border-radius: 8px;
        background: #f3fbf8;
        color: var(--accent-strong);
        font-size: clamp(1.45rem, 4vw, 2.4rem);
        font-weight: 950;
        text-align: center;
      }

      .charades-card {
        display: grid;
        min-height: clamp(220px, 34vh, 380px);
        place-items: center;
        padding: clamp(24px, 5vw, 58px);
        border: 3px solid rgba(28, 111, 103, 0.22);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 0%, rgba(177, 219, 208, 0.68), transparent 50%),
          linear-gradient(135deg, #fbfffd, #e7f4ef);
        text-align: center;
      }

      .charades-keyword {
        color: var(--accent-strong);
        font-size: clamp(3rem, 10vw, 7.2rem);
        font-weight: 950;
        line-height: 1.05;
        word-break: keep-all;
      }

      .charades-controls {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      .charades-progress {
        display: grid;
        min-height: 42px;
        place-items: center;
        color: var(--muted);
        font-weight: 900;
      }

      .answer-panel {
        display: none;
        position: relative;
        overflow: hidden;
        min-height: clamp(260px, 38vh, 440px);
        place-items: center;
        padding: clamp(28px, 5vw, 64px);
        border: 3px solid rgba(123, 63, 0, 0.28);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 214, 148, 0.58), transparent 42%),
          linear-gradient(135deg, rgba(255, 248, 238, 0.98), rgba(255, 236, 207, 0.94)),
          #fff5e8;
        box-shadow:
          0 24px 60px rgba(123, 63, 0, 0.22),
          inset 0 0 0 1px rgba(255, 255, 255, 0.62);
        text-align: center;
      }

      .answer-panel.visible {
        display: grid;
        animation: answerPop 620ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .answer-panel.visible::after {
        position: absolute;
        inset: -28%;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 184, 77, 0.55), transparent 28%),
          conic-gradient(
            from 0deg,
            transparent,
            rgba(255, 190, 92, 0.34),
            transparent,
            rgba(255, 214, 148, 0.28),
            transparent
          );
        content: "";
        pointer-events: none;
        animation: answerFlash 820ms ease-out both;
      }

      .answer-panel h2 {
        position: relative;
        z-index: 1;
        margin: 0 0 18px;
        color: var(--answer);
        font-size: clamp(1.15rem, 2vw, 1.6rem);
        font-weight: 900;
      }

      .answer-text {
        position: relative;
        z-index: 1;
        margin: 0;
        max-width: 980px;
        color: #2a1705;
        font-size: clamp(2.6rem, 8vw, 6.8rem);
        font-weight: 950;
        line-height: 1.08;
        white-space: pre-line;
        word-break: keep-all;
      }

      .score-text {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        margin-top: 28px;
        padding: 0 20px;
        border-radius: 999px;
        background: rgba(123, 63, 0, 0.1);
        color: var(--answer);
        font-size: clamp(1.4rem, 3vw, 2.5rem);
        font-weight: 950;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      @keyframes answerPop {
        0% {
          opacity: 0;
          transform: translateY(34px) scale(0.72);
        }

        48% {
          opacity: 1;
          transform: translateY(-10px) scale(1.055);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes answerFlash {
        0% {
          opacity: 0;
          transform: scale(0.3) rotate(0deg);
        }

        35% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: scale(1.45) rotate(22deg);
        }
      }

      @media (max-width: 820px) {
        .topbar,
        .problem-header {
          align-items: stretch;
          flex-direction: column;
        }

        .status {
          justify-content: space-between;
        }

        .board {
          grid-template-columns: repeat(5, minmax(48px, 1fr));
          gap: 12px;
          padding: 18px;
        }
      }

      @media (max-width: 460px) {
        .app {
          width: min(100% - 20px, 1120px);
          padding-top: 16px;
        }

        .status,
        .actions {
          display: grid;
          grid-template-columns: 1fr;
        }

        .pill,
        .reset-btn,
        .secondary-btn,
        .primary-btn {
          width: 100%;
        }

        .board {
          grid-template-columns: repeat(4, minmax(48px, 1fr));
          gap: 10px;
          padding: 14px;
        }

        .problem-panel {
          padding: 20px;
        }

        .answer-text {
          font-size: clamp(2.15rem, 13vw, 4.4rem);
        }

        .ox-options {
          grid-template-columns: 1fr;
        }

        .charades-top,
        .charades-controls {
          grid-template-columns: 1fr;
        }

        .charades-top {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section id="homeScreen" class="screen active" aria-labelledby="homeTitle">
        <header class="topbar">
          <div class="title-wrap">
            <h1 id="homeTitle">문제 풀이 보드</h1>
            <p class="subtitle">남은 문제를 선택하고, 답을 확인한 뒤 메인으로 돌아오면 해당 문제는 사라집니다.</p>
          </div>
          <div class="status" aria-live="polite">
            <span id="progressPill" class="pill">문제 불러오는 중</span>
            <button id="resetButton" class="reset-btn" type="button">초기화</button>
          </div>
        </header>

        <div id="problemBoard" class="board" aria-label="남은 문제 목록"></div>

        <div id="emptyState" class="empty-state">
          <strong>모든 문제를 풀었습니다.</strong>
          <p>초기화하면 문제를 다시 표시합니다.</p>
          <button class="primary-btn" type="button" data-reset>다시 시작</button>
        </div>
      </section>

      <section id="problemScreen" class="screen" aria-labelledby="problemTitle">
        <header class="problem-header">
          <div>
            <div id="problemNumber" class="problem-number"></div>
            <div id="constraintText" class="constraint-text"></div>
            <h1 id="problemTitle">문제</h1>
          </div>
        </header>

        <article class="problem-panel">
          <div id="problemText" class="problem-text"></div>

          <div id="answerPanel" class="answer-panel" aria-live="polite">
            <h2>정답</h2>
            <p id="answerText" class="answer-text"></p>
            <div id="scoreText" class="score-text"></div>
          </div>

          <div id="problemMedia" class="problem-media"></div>

          <div class="actions">
            <button id="showAnswerButton" class="secondary-btn" type="button">답 보기</button>
            <button id="completeButton" class="primary-btn" type="button" hidden>메인으로 돌아가기</button>
          </div>
        </article>
      </section>
    </main>

      document.querySelector("[data-reset]").addEventListener("click", resetProgress);

      function loadCompletedProblems() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return new Set(saved);
        } catch {
          return new Set();
        }
      }

      function saveCompletedProblems() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.completed]));
      }

      function shuffleProblems(items) {
        const copied = [...items];

        for (let index = copied.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [copied[index], copied[randomIndex]] = [copied[randomIndex], copied[index]];
        }

        return copied;
      }

      function buildNumberedProblems() {
        return shuffleProblems(problemContents).map((content, index) => {
          const number = index + 1;

          return {
            ...content,
            id: number,
            title: `문제 ${number}`,
          };
        });
      }

      function renderHome() {
        const remainingProblems = problems.filter((problem) => !state.completed.has(problem.id));
        const remainingCount = remainingProblems.length;

        progressPill.textContent = `${remainingCount} / ${problems.length} 남음`;
        board.innerHTML = "";

        problems.forEach((problem) => {
          if (state.completed.has(problem.id)) {
            const slot = document.createElement("div");
            slot.className = "problem-slot";
            slot.setAttribute("aria-hidden", "true");
            board.append(slot);
            return;
          }

          const button = document.createElement("button");
          button.className = "problem-dot";
          button.type = "button";
          button.textContent = problem.id;
          button.setAttribute("aria-label", `${problem.title} 열기`);
          button.addEventListener("click", () => openProblem(problem.id));
          board.append(button);
        });

        emptyState.style.display = remainingCount > 0 ? "none" : "block";
      }

      function openProblem(problemId) {
        const problem = problems.find((item) => item.id === problemId);

        if (!problem) {
          return;
        }

        stopCharadesTimer();
        state.currentProblem = problem;
        resetCharadesState();
        const problemScore = getProblemScore(problem);
        const constraintLabel = getConstraintLabel(problem.constraint);
        const isCharades = isCharadesProblem(problem);
        problemNumber.textContent = `${problem.id} / ${problems.length} · ${problemScore}점`;
        constraintText.hidden = !constraintLabel;
        constraintText.textContent = constraintLabel ? `${constraintLabel}만 풀어주세요` : "";
        problemTitle.textContent = problem.title;
        renderProblemContent(problem);
        answerText.textContent = problem.answer;
        scoreText.textContent = `${problemScore}점`;
        answerPanel.classList.remove("visible");
        showAnswerButton.hidden = isCharades;
        completeButton.hidden = !isCharades;
        showScreen("problem");
        if (isCharades) {
          problemText.querySelector("[data-charades-start]")?.focus();
        } else {
          showAnswerButton.focus();
        }
      }

      function renderProblemContent(problem) {
        problemText.className = "problem-text";
        problemText.replaceChildren();
        problemMedia.replaceChildren();
        problemMedia.classList.remove("has-answer-overlay");
        problemMedia.before(answerPanel);

        if (isCharadesProblem(problem)) {
          renderCharadesProblem(problem);
          return;
        }

        const question = createTextElement("div", "question-main", problem.question);
        problemText.append(question);

        if (problem.imageSrc) {
          const image = document.createElement("img");
          image.className = "question-image";
          image.src = problem.imageSrc;
          image.alt = problem.question;
          problemMedia.classList.add("has-answer-overlay");
          problemMedia.append(image);
          problemMedia.append(answerPanel);
        }
      }

      function renderCharadesProblem(problem) {
        const stage = document.createElement("div");
        stage.className = "charades-stage";

        const top = document.createElement("div");
        top.className = "charades-top";
        top.append(
          createTextElement("div", "charades-topic", `몸으로 말해요 · ${problem.topic}`),
          createTextElement("div", "charades-timer", formatTimer(state.charades.remainingSeconds)),
        );
        top.lastElementChild.dataset.charadesTimer = "";

        const card = document.createElement("div");
        card.className = "charades-card";
        const keyword = createTextElement("div", "charades-keyword", "");
        keyword.dataset.charadesKeyword = "";
        card.append(keyword);

        const progress = createTextElement("div", "charades-progress", "");
        progress.dataset.charadesProgress = "";

        const controls = document.createElement("div");
        controls.className = "charades-controls";

        const startButton = createTextElement("button", "primary-btn", "시작");
        startButton.type = "button";
        startButton.dataset.charadesStart = "";
        startButton.addEventListener("click", startCharadesTimer);

        const resetButton = createTextElement("button", "secondary-btn", "타이머 초기화");
        resetButton.type = "button";
        resetButton.addEventListener("click", resetCharadesTimer);

        const previousButton = createTextElement("button", "secondary-btn", "이전");
        previousButton.type = "button";
        previousButton.addEventListener("click", () => moveCharadesKeyword(-1));

        const nextButton = createTextElement("button", "primary-btn", "다음");
        nextButton.type = "button";
        nextButton.addEventListener("click", () => moveCharadesKeyword(1));

        const restartButton = createTextElement("button", "secondary-btn", "첫 제시어");
        restartButton.type = "button";
        restartButton.addEventListener("click", () => {
          state.charades.index = 0;
          updateCharadesView();
        });

        controls.append(startButton, resetButton, previousButton, nextButton, restartButton);
        stage.append(top, card, progress, controls);
        problemText.append(stage);
        updateCharadesView();
      }

      function createTextElement(tagName, className, text) {
        const element = document.createElement(tagName);
        element.className = className;
        element.textContent = text;
        return element;
      }

      function isCharadesProblem(problem) {
        return problem.type === "charades" && Array.isArray(problem.keywords);
      }

      function resetCharadesState() {
        state.charades.index = 0;
        state.charades.remainingSeconds = 120;
      }

      function moveCharadesKeyword(direction) {
        const problem = state.currentProblem;

        if (!isCharadesProblem(problem)) {
          return;
        }

        const lastIndex = problem.keywords.length - 1;
        state.charades.index = Math.min(Math.max(state.charades.index + direction, 0), lastIndex);
        updateCharadesView();
      }

      function updateCharadesView() {
        const problem = state.currentProblem;

        if (!isCharadesProblem(problem)) {
          return;
        }

        const keyword = problem.keywords[state.charades.index] || "";
        const keywordElement = problemText.querySelector("[data-charades-keyword]");
        const progressElement = problemText.querySelector("[data-charades-progress]");
        const timerElement = problemText.querySelector("[data-charades-timer]");

        if (keywordElement) {
          keywordElement.textContent = keyword;
        }

        if (progressElement) {
          progressElement.textContent = `${state.charades.index + 1} / ${problem.keywords.length}`;
        }

        if (timerElement) {
          timerElement.textContent = formatTimer(state.charades.remainingSeconds);
        }
      }

      function startCharadesTimer() {
        if (state.charades.timerId) {
          return;
        }

        if (state.charades.remainingSeconds <= 0) {
          state.charades.remainingSeconds = 120;
          updateCharadesView();
        }

        state.charades.timerId = window.setInterval(() => {
          state.charades.remainingSeconds -= 1;
          updateCharadesView();

          if (state.charades.remainingSeconds <= 0) {
            stopCharadesTimer();
          }
        }, 1000);
      }

      function resetCharadesTimer() {
        stopCharadesTimer();
        state.charades.remainingSeconds = 120;
        updateCharadesView();
      }

      function stopCharadesTimer() {
        if (!state.charades.timerId) {
          return;
        }

        window.clearInterval(state.charades.timerId);
        state.charades.timerId = null;
      }

      function formatTimer(totalSeconds) {
        const safeSeconds = Math.max(totalSeconds, 0);
        const minutes = Math.floor(safeSeconds / 60);
        const seconds = String(safeSeconds % 60).padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      function getProblemScore(problem) {
        const score = Number(problem.score);
        return [100, 200, 300].includes(score) ? score : 100;
      }

      function getConstraintLabel(constraint) {
        const labels = {
          "2026 새가족": "2026 새가족",
          "새내기": "새내기",
          "리더": "리더",
        };

        return labels[constraint] || "";
      }

      function showAnswer() {
        answerPanel.classList.add("visible");
        showAnswerButton.hidden = true;
        completeButton.hidden = false;
        completeButton.focus();
      }

      function completeCurrentProblem() {
        if (!state.currentProblem) {
          return;
        }

        stopCharadesTimer();
        state.completed.add(state.currentProblem.id);
        saveCompletedProblems();
        state.currentProblem = null;
        renderHome();
        showScreen("home");
      }

      function resetProgress() {
        stopCharadesTimer();
        state.completed.clear();
        saveCompletedProblems();
        problems = buildNumberedProblems();
        state.currentProblem = null;
        renderHome();
        showScreen("home");
      }

      function showScreen(screenName) {
        const isHome = screenName === "home";
        homeScreen.classList.toggle("active", isHome);
        problemScreen.classList.toggle("active", !isHome);

        if (isHome) {
          stopCharadesTimer();
          renderHome();
        }
